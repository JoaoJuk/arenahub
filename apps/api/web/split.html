<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dividir reserva — Liggo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Espelha apps/mobile/src/theme.ts — o design system "Liggo Kinetic".
     Se um token mudar lá, mude aqui também: esta página duplica a paleta à mão.
     Os DOIS verdes: --green (#106e00) é o verde de TEXTO sobre fundo claro;
     --neon (#39ff14) é o verde de PREENCHIMENTO, sempre com texto escuro em cima. */
  :root{
    --bg:#f9f9f9; --card:#ffffff; --gray:#f4f4f4; --line:#e5e5e5;
    --green:#106e00; --green-dim:rgba(16,110,0,0.10);
    --neon:#39ff14; --neon-dark:#2ed610; --on-neon:#1a1c1c;
    --txt:#1a1c1c; --mut:#5e5e5e; --dim:#a0a0a0;
    --font-display:'Inter',-apple-system,sans-serif;
    --font-body:'Inter',-apple-system,sans-serif;
    --radius-card:24px; --radius-sm:16px; --radius-pill:999px;
    --elev:0 10px 30px rgba(0,0,0,0.05);
  }
  *{box-sizing:border-box;margin:0}
  body{
    font-family:var(--font-body);background:var(--bg);color:var(--txt);
    min-height:100vh;display:flex;justify-content:center;padding:28px 20px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:420px}
  .logo{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-0.03em;margin-bottom:20px;color:var(--green)}
  .logo span{color:var(--neon)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;margin-bottom:16px;box-shadow:var(--elev)}
  h1{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;margin-bottom:4px}
  .mut{color:var(--mut);font-size:14px}
  .price{font-family:var(--font-body);font-variant-numeric:tabular-nums;font-weight:700;font-size:32px;letter-spacing:-0.01em;margin:10px 0 2px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:0.075em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
  input{
    width:100%;padding:15px 16px;border-radius:var(--radius-sm);border:2px solid transparent;
    background:var(--gray);color:var(--txt);font-size:16px;font-family:var(--font-body);
  }
  input:focus{outline:0;border-color:var(--neon)}
  input::placeholder{color:var(--dim)}
  .methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
  .methods button{
    padding:14px 4px;border-radius:var(--radius-sm);border:2px solid transparent;background:var(--gray);
    color:var(--txt);font-size:13px;font-weight:700;font-family:var(--font-body);cursor:pointer;
  }
  /* Selecionado troca o FUNDO (claro -> preto), não só a borda */
  .methods button.sel{background:var(--txt);color:var(--neon);border-color:var(--neon)}
  .cta{
    width:100%;margin-top:20px;min-height:56px;padding:16px;border:0;border-radius:var(--radius-pill);
    background:var(--neon);color:var(--on-neon);font-size:16px;font-weight:700;
    font-family:var(--font-body);cursor:pointer;transition:transform .12s,box-shadow .12s;
  }
  .cta:active{transform:scale(.97);box-shadow:0 0 20px rgba(57,255,20,.5)}
  .cta:disabled{opacity:.4}
  .who{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
  .who:first-child{border-top:0}
  .ok{color:var(--green);font-weight:700;font-size:13px} .pend{color:var(--mut);font-size:13px}
  .msg{margin-top:12px;font-size:14px;text-align:center}
  /* Cartão-isca em preto, como o card "Pro" do perfil no app */
  .promo{background:var(--txt);border-color:var(--txt);text-align:center}
  .promo h1,.promo .mut{color:#fff}
  .promo .mut{opacity:.7}
  .promo .cta{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Liggo<span>.</span></div>

  <div class="card">
    <div class="mut">Você foi convidado para um jogo</div>
    <h1 style="margin-top: 8px;">{{ARENA}}</h1>
    <div class="mut">{{COURT}} · {{DATE}} · {{TIME}}</div>
    <div class="price">{{SHARE_AMOUNT}}</div>
    <div class="mut">sua parte (total da quadra: {{TOTAL}})</div>
  </div>

  <div class="card" id="form">
    <h1>Entrar na divisão</h1>
    <label>Seu nome</label>
    <input id="name" placeholder="Ex.: João Silva" autocomplete="name">
    <label>Telefone (WhatsApp)</label>
    <input id="phone" placeholder="(41) 99999-9999" inputmode="tel" autocomplete="tel">
    <label>Forma de pagamento</label>
    <div class="methods">
      <button data-m="pix" class="sel">Pix</button>
      <button data-m="card">Cartão</button>
      <button data-m="on_site">No local</button>
    </div>
    <button class="cta" id="pay">Pagar minha parte</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h1 style="font-size:15px">Quem já entrou</h1>
    <div id="people" class="mut" style="margin-top:8px">Carregando…</div>
  </div>

  <!-- Isca híbrida: banner para baixar o app -->
  <div class="card promo">
    <h1>Baixe o Liggo</h1>
    <div class="mut" style="margin-top: 6px; font-size: 13px;">
      Organize seus jogos, descubra partidas abertas e não pague mais taxa de serviço.
    </div>
    <button class="cta" onclick="alert('Indo para a loja de aplicativos!')">Baixar app</button>
  </div>
</div>

<script>
const TOKEN = '{{TOKEN}}';
let method = 'pix';
document.querySelectorAll('.methods button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.methods button').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel'); method = b.dataset.m;
});

async function refresh() {
  const r = await fetch('/split/' + TOKEN); if (!r.ok) return;
  const d = await r.json();
  const label = { pix: 'Pix', card: 'Cartão', on_site: 'No local' };
  document.getElementById('people').innerHTML =
    (d.shares.map(s => `<div class="who"><span>${s.name} · ${label[s.method]}</span><span class="${s.status==='pending'?'pend':'ok'}">${s.status==='pending'?'aguardando':'pago'}</span></div>`).join('')
    || 'Ninguém ainda — seja o primeiro!')
    + (d.remaining > 0 ? `<div class="who"><span class="pend">${d.remaining} vaga(s) restante(s)</span><span></span></div>` : '')
    + (d.status === 'confirmed' ? '<div class="msg ok">Reserva confirmada!</div>' : '');
}
refresh(); setInterval(refresh, 5000);

document.getElementById('pay').onclick = async () => {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const msg = document.getElementById('msg');
  if (name.length < 2 || phone.length < 8) { msg.textContent = 'Preencha nome e telefone.'; return; }
  const btn = document.getElementById('pay'); btn.disabled = true;
  const r = await fetch('/split/' + TOKEN + '/join', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, phone, method }),
  });
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.error || 'Erro, tente novamente.'; btn.disabled = false; return; }
  if (d.checkoutUrl) { location.href = d.checkoutUrl; }
  else { msg.innerHTML = '<span class="ok">Presença confirmada! Pague no local no dia do jogo.</span>'; refresh(); }
};
</script>
</body>
</html>
