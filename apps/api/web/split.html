<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dividir reserva — ArenaHub</title>
<style>
  :root{--bg:#0e1a13;--card:#16241c;--line:#24382c;--green:#22c55e;--txt:#f0fdf4;--mut:#9db8a8}
  *{box-sizing:border-box;margin:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:420px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.5px;margin-bottom:16px}.logo span{color:var(--green)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  h1{font-size:18px;margin-bottom:4px} .mut{color:var(--mut);font-size:14px}
  .price{font-size:32px;font-weight:800;color:var(--green);margin:12px 0 2px}
  label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px}
  .methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
  .methods button{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:13px;cursor:pointer}
  .methods button.sel{border-color:var(--green);background:#132e1d;font-weight:700}
  .cta{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--green);color:#04170b;font-size:16px;font-weight:800;cursor:pointer}
  .cta:disabled{opacity:.5}
  .who{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .who:last-child{border:0}
  .ok{color:var(--green)} .pend{color:var(--mut)}
  .msg{margin-top:12px;font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Arena<span>Hub</span></div>

  <div class="card">
    <div class="mut">⚽ Você foi convidado para um jogo!</div>
    <h1 style="margin-top: 8px;">{{ARENA}}</h1>
    <div class="mut">{{COURT}} · {{DATE}} · {{TIME}}</div>
    <div class="price">{{SHARE_AMOUNT}}</div>
    <div class="mut">sua parte (total da quadra: {{TOTAL}})</div>
  </div>

  <div class="card" id="form">
    <h1>Entrar na divisão</h1>
    <label>Seu nome</label>
    <input id="name" placeholder="Ex.: João Silva" autocomplete="name">
    <label>Telefone (WhatsApp)</label>
    <input id="phone" placeholder="(41) 99999-9999" inputmode="tel" autocomplete="tel">
    <label>Forma de pagamento</label>
    <div class="methods">
      <button data-m="pix" class="sel">⚡ Pix</button>
      <button data-m="card">💳 Cartão</button>
      <button data-m="on_site">🏟️ No local</button>
    </div>
    <button class="cta" id="pay">Pagar minha parte</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h1 style="font-size:15px">Quem já entrou</h1>
    <div id="people" class="mut" style="margin-top:8px">Carregando…</div>
  </div>

  <!-- Isca Híbrida: Banner para baixar o app -->
  <div class="card" style="border-color: var(--green); text-align: center; background: rgba(34, 197, 94, 0.05);">
    <h1 style="color: var(--green); font-size: 16px;">Baixe o ArenaHub</h1>
    <div class="mut" style="margin-top: 6px; font-size: 13px; margin-bottom: 12px;">
      Organize seus jogos, descubra partidas abertas e não pague mais taxa de serviço!
    </div>
    <button class="cta" style="margin-top: 0; padding: 10px; background: transparent; border: 1px solid var(--green); color: var(--green);" onclick="alert('Indo para a loja de aplicativos!')">
      Baixar App
    </button>
  </div>
</div>

<script>
const TOKEN = '{{TOKEN}}';
let method = 'pix';
document.querySelectorAll('.methods button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.methods button').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel'); method = b.dataset.m;
});

async function refresh() {
  const r = await fetch('/split/' + TOKEN); if (!r.ok) return;
  const d = await r.json();
  const label = { pix: 'Pix', card: 'Cartão', on_site: 'No local' };
  document.getElementById('people').innerHTML =
    (d.shares.map(s => `<div class="who"><span>${s.name} · ${label[s.method]}</span><span class="${s.status==='pending'?'pend':'ok'}">${s.status==='pending'?'aguardando':'✔ ok'}</span></div>`).join('')
    || 'Ninguém ainda — seja o primeiro!')
    + (d.remaining > 0 ? `<div class="who"><span class="pend">${d.remaining} vaga(s) restante(s)</span><span></span></div>` : '')
    + (d.status === 'confirmed' ? '<div class="msg ok">🎉 Reserva confirmada!</div>' : '');
}
refresh(); setInterval(refresh, 5000);

document.getElementById('pay').onclick = async () => {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const msg = document.getElementById('msg');
  if (name.length < 2 || phone.length < 8) { msg.textContent = 'Preencha nome e telefone.'; return; }
  const btn = document.getElementById('pay'); btn.disabled = true;
  const r = await fetch('/split/' + TOKEN + '/join', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, phone, method }),
  });
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.error || 'Erro, tente novamente.'; btn.disabled = false; return; }
  if (d.checkoutUrl) { location.href = d.checkoutUrl; }
  else { msg.innerHTML = '<span class="ok">✔ Presença confirmada! Pague no local no dia do jogo.</span>'; refresh(); }
};
</script>
</body>
</html>
